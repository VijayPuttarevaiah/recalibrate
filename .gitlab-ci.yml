stages:
  - test
  - publish
  - deploy

variables:
  DOCKER_REPO: "docker.io/vijayputtarevaiah/projectgroup2"
  DOCKER_IMAGE: "$DOCKER_REPO:$CI_COMMIT_SHORT_SHA"

test_backend:
  stage: test
  image: python:3.11
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
    - uv run pytest -q || (code=$?; if [ "$code" -eq 5 ]; then echo "No tests collected, skipping"; else exit "$code"; fi)
  only:
    - develop
    - qa
    - main

test_frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint 2>/dev/null || echo "No lint script, skipping"
    - npm test -- --passWithNoTests 2>/dev/null || echo "No tests found, skipping"
  only:
    - develop
    - qa
    - main

publish:
  stage: publish
  image: docker:24
  tags:
    - Project2
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  script:
    - docker --version
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -f backend/Dockerfile -t "$DOCKER_IMAGE" backend
    - docker push "$DOCKER_IMAGE"
  only:
    - develop
    - main

deploy:
  stage: deploy
  image: alpine:3.20
  tags:
    - Project2
  before_script:
    - apk add --no-cache openssh-client
    - chmod 400 "$ID_RSA"
  script:
    - ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "echo '$DOCKERHUB_TOKEN' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
    - ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "docker pull '$DOCKER_IMAGE'"
    - ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "docker container rm -f $APP_NAME || true"
    - ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "docker run -d --restart always -p $HOST_PORT:8000 --name $APP_NAME -e GOOGLE_API_KEY='$GOOGLE_API_KEY' -e OPENROUTER_API_KEY='$OPENROUTER_API_KEY' '$DOCKER_IMAGE'"
  environment:
    name: $ENV_NAME
    url: "http://csci5308-vm2.research.cs.dal.ca:$HOST_PORT"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        ENV_NAME: production
        APP_NAME: my-app
        HOST_PORT: "8073"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        ENV_NAME: development
        APP_NAME: my-app-dev
        HOST_PORT: "8074"
