##############################################################################
# .gitlab-ci.yml — CI/CD Pipeline for GROUP02
#
# Flow:  develop → DEV  |  qa → TEST  |  main → PRODUCTION
#
# How it works:
#   1. Test stage runs in GitLab runner (lint, pytest)
#   2. Deploy stage SCPs the code to VM and runs docker-compose
#   No git or registry needed on the VM — just Docker.
##############################################################################

stages:
  - test
  - deploy

variables:
  VM_USER: student
  VM_HOST: csci5308-vm3.research.cs.dal.ca
  SSH_OPTS: "-o StrictHostKeyChecking=no"

# ─── Test ────────────────────────────────────────────────────────────────────

test_backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install uv --break-system-packages
    - cd backend
    - uv sync --frozen --no-dev
  script:
    - uv run pytest tests/ -v --tb=short || echo "No tests found yet, skipping"
  only:
    - develop
    - qa
    - main

test_frontend:
  stage: test
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint 2>/dev/null || echo "No lint script, skipping"
    - npm test -- --passWithNoTests 2>/dev/null || echo "No tests found, skipping"
  only:
    - develop
    - qa
    - main

# ─── Deploy Template ─────────────────────────────────────────────────────────

.deploy_base: &deploy_base
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts 2>/dev/null

# ─── Deploy DEV ──────────────────────────────────────────────────────────────

deploy_dev:
  <<: *deploy_base
  variables:
    ENV_NAME: dev
    APP_DIR: /home/student/group02/dev
    API_PORT: "8001"
    WEB_PORT: "8081"
    DB_URL: "mysql+pymysql://CSCI5308_3_DEVINT_USER:uKaik8sie7@db.research.cs.dal.ca:3306/CSCI5308_3_DEVINT"
  script:
    # Create app directory on VM
    - ssh $SSH_OPTS $VM_USER@$VM_HOST "mkdir -p $APP_DIR"

    # Sync code to VM (fast — only sends changes)
    - rsync -avz --delete
        --exclude '.git'
        --exclude 'node_modules'
        --exclude '__pycache__'
        --exclude '.env'
        -e "ssh $SSH_OPTS"
        ./ $VM_USER@$VM_HOST:$APP_DIR/

    # Create .env and deploy
    - |
      ssh $SSH_OPTS $VM_USER@$VM_HOST << ENDSSH
        cd $APP_DIR

        cat > .env << EOF
      DATABASE_URL=$DB_URL
      GOOGLE_API_KEY=$GOOGLE_API_KEY
      OPENROUTER_API_KEY=$OPENROUTER_API_KEY
      SERPER_API_KEY=$SERPER_API_KEY
      SECRET_KEY=$SECRET_KEY
      EOF

        cat > docker-compose.deploy.yml << EOF
      services:
        api:
          build:
            context: ./backend
            dockerfile: Dockerfile
          ports:
            - "$API_PORT:8000"
          environment:
            - DATABASE_URL=\${DATABASE_URL}
            - GOOGLE_API_KEY=\${GOOGLE_API_KEY}
            - OPENROUTER_API_KEY=\${OPENROUTER_API_KEY}
            - SERPER_API_KEY=\${SERPER_API_KEY}
            - SECRET_KEY=\${SECRET_KEY}
          restart: always

        frontend:
          build:
            context: ./frontend
            dockerfile: Dockerfile
          ports:
            - "$WEB_PORT:80"
          restart: always
      EOF

        docker-compose -f docker-compose.deploy.yml -p $ENV_NAME down --remove-orphans 2>/dev/null || true
        docker-compose -f docker-compose.deploy.yml -p $ENV_NAME up -d --build
        docker system prune -f
        echo "=== $ENV_NAME deployed on ports $API_PORT / $WEB_PORT ==="
      ENDSSH
  environment:
    name: development
    url: http://csci5308-vm3.research.cs.dal.ca:8081
  only:
    - develop

