publish:
  image: docker:24
  stage: publish
  tags: 
    - Project2
  variables:
    # these values may need to be different if using TLS, k8s, etc.
    # You can alternatively set defaults in your runner config
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind

  script:
    - docker --version
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -f backend/Dockerfile -t docker.io/$DOCKERHUB_USERNAME/projectgroup2:$CI_COMMIT_SHORT_SHA backend
    - docker push docker.io/$DOCKERHUB_USERNAME/projectgroup2:$CI_COMMIT_SHORT_SHA
  only:
    - main


deploy:
  image: alpine:latest
  stage: deploy
  tags:
    - Project2
  script:
    # Set correct permissions on the key file (Variable type must be 'File')
    - chmod 400 $ID_RSA
    - apk update && apk add openssh-client
    # 1. Login using the token via STDIN
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "echo '$DOCKERHUB_TOKEN' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin"
    # 2. Pull the image
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker pull docker.io/$DOCKERHUB_USERNAME/projectgroup2:$CI_COMMIT_SHORT_SHA"
    # 3. Remove old container (ignore error if it doesn't exist)
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker container rm -f my-app || true"
    # 4. Run the new container
    - ssh -i $ID_RSA -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker run -d -p 8073:8000 --name my-app docker.io/$DOCKERHUB_USERNAME/projectgroup2:$CI_COMMIT_SHORT_SHA"
  environment:
    name: production
    url: csci5308-vm2.research.cs.dal.ca
  only:
    - main