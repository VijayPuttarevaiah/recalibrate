# This file is a template-style CI/CD pipeline adapted for this project.
# Stages run in order; jobs in same stage can run in parallel.
# First 4 stages run on all branches; publish and deploy only on develop/main.

stages:
  - build
  - test
  - run-dpy
  - submit-dcode
  - publish
  - deploy

variables:
  DOCKER_REPO: "docker.io/vijayputtarevaiah/projectgroup2"
  DOCKER_BACKEND_IMAGE: "$DOCKER_REPO:backend-$CI_COMMIT_SHORT_SHA"
  DOCKER_FRONTEND_IMAGE: "$DOCKER_REPO:frontend-$CI_COMMIT_SHORT_SHA"

# ── Build ─────────────────────────────────────────────────────────────────────

backend-build:
  stage: build
  image: python:3.11
  before_script:
    - pip install uv
  script:
    - cd backend
    - python --version
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
    - uv run python -m compileall -q .
    - echo "Dependencies installed successfully"
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*

frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - frontend/**/*

# ── Test ──────────────────────────────────────────────────────────────────────

backend-test:
  stage: test
  image: python:3.11
  before_script:
    - pip install uv
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
    - uv run pytest
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*

backend-test-coverage:
  stage: test
  image: python:3.11
  before_script:
    - pip install uv
  script:
    - cd backend
    - pip install --upgrade pip
    - pip install uv
    - uv sync --frozen
    - |
      {
        echo "=== Python Syntax Check ==="
        python -m compileall . || echo "SKIP: compile issues"
        echo "=== Running Pytest with Coverage ==="
        uv run pytest -v --tb=short \
          --cov=. \
          --cov-config=.coveragerc \
          --cov-report=term-missing \
          --cov-report=html:coverage_html \
          --cov-report=xml:coverage.xml \
          || echo "Some tests failed"
        echo "=== Backend Test Complete ==="
      } 2>&1 | tee backend_test_output.log
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    name: "backend-test-$CI_COMMIT_SHORT_SHA"
    expose_as: "Coverage Report"
    paths:
      - backend/backend_test_output.log
      - backend/coverage_html/
      - backend/coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    expire_in: 1 week
    when: always
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*

frontend-test:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run test -- --run
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - frontend/**/*

# ── Designite ─────────────────────────────────────────────────────────────────

run-dpy-job:
  stage: run-dpy
  image: python:3.12
  tags:
    - dalfcs_docker_kvm
  script:
    - echo "Downloading DPy"
    - curl -L https://www.designite-tools.com/assets/DPy-linux.zip -o DPy-linux.zip
    - mkdir DPy && unzip DPy-linux.zip -d DPy/
    - chmod +x DPy/DPy
    - echo "Running DPy"
    - mkdir smells/
    - DPy/DPy analyze -i $CI_PROJECT_DIR/backend -o $CI_PROJECT_DIR/smells/ -f csv
  artifacts:
    name: "designite-smells-$CI_COMMIT_SHORT_SHA"
    expose_as: "DPy Smell Reports"
    paths:
      - smells/
    expire_in: 4 weeks
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*

submit-dcode-job:
  stage: submit-dcode
  image: python:3.10-alpine
  tags:
    - dalfcs_docker_kvm
  dependencies:
    - run-dpy-job
  script:
    - pip3 install -r $CI_PROJECT_DIR/.quality/requirements.txt
    - python3 $CI_PROJECT_DIR/.quality/push_to_dcode.py $DCODE_PROJECT_ID $DCODE_API_KEY $CI_PROJECT_DIR/smells/ $CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/**/*

# ── Publish ───────────────────────────────────────────────────────────────────

publish:
  stage: publish
  tags:
    - Project2
  image: docker:24
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  script:
    - docker --version
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -f backend/Dockerfile -t "$DOCKER_BACKEND_IMAGE" backend
    - docker push "$DOCKER_BACKEND_IMAGE"
    - docker build -f frontend/Dockerfile -t "$DOCKER_FRONTEND_IMAGE" --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" frontend
    - docker push "$DOCKER_FRONTEND_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        VITE_API_BASE_URL: "http://3.22.221.134:8073"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        VITE_API_BASE_URL: "http://3.22.221.134:8074"

# ── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  image: alpine:latest
  stage: deploy
  tags:
    - Project2
  before_script:
    - chmod 400 "$EC2_SSH_KEY"
    - apk add --no-cache openssh-client
  script:
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "echo \"$DOCKERHUB_TOKEN\" | docker login -u \"$DOCKERHUB_USERNAME\" --password-stdin"
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker network create app_net || true"
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker pull $DOCKER_BACKEND_IMAGE && docker pull $DOCKER_FRONTEND_IMAGE"
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker container rm -f $APP_NAME || true"
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker container rm -f $APP_NAME_FRONTEND || true"
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker run -d --network app_net -p $HOST_PORT:8000 --name $APP_NAME --restart always -e DATABASE_URL=$DATABASE_URL -e GOOGLE_API_KEY=$GOOGLE_API_KEY -e OPENROUTER_API_KEY=$OPENROUTER_API_KEY -e SERPER_API_KEY=$SERPER_API_KEY $DOCKER_BACKEND_IMAGE"
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker run -d --network app_net -p $FRONTEND_HOST_PORT:80 --name $APP_NAME_FRONTEND --restart always $DOCKER_FRONTEND_IMAGE"
  environment:
    name: $ENV_NAME
    url: "http://3.22.221.134:$FRONTEND_HOST_PORT"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        ENV_NAME: production
        APP_NAME: my-app
        HOST_PORT: "8073"
        APP_NAME_FRONTEND: my-app-frontend
        FRONTEND_HOST_PORT: "80"
        DATABASE_URL: "mysql+pymysql://user:password@mysql_db:3306/backend_db"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        ENV_NAME: development
        APP_NAME: my-app-dev
        HOST_PORT: "8074"
        APP_NAME_FRONTEND: my-app-dev-frontend
        FRONTEND_HOST_PORT: "8081"
        DATABASE_URL: "mysql+pymysql://user:password@mysql_db:3306/backend_db"