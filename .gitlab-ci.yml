publish:
  image: docker:24
  stage: publish
  tags:
    - Project2
  variables:
    # these values may need to be different if using TLS, k8s, etc.
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  script:
    - docker --version
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -f backend/Dockerfile -t "$DOCKER_IMAGE" backend
    - docker push "$DOCKER_IMAGE"
  only:
    - develop
    - main

deploy:
  image: alpine:latest
  stage: deploy
  tags:
    - Project2
  before_script:
    - chmod 400 "$EC2_SSH_KEY"
    - apk add --no-cache openssh-client
  script:
    # 1. Login using the token via STDIN
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "echo \"$DOCKERHUB_TOKEN\" | docker login -u \"$DOCKERHUB_USERNAME\" --password-stdin"
    # 2. Pull the image
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker pull $DOCKER_IMAGE"
    # 3. Remove old container (ignore error if it doesn't exist)
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker container rm -f $APP_NAME || true"
    # 4. Run the new container
    - ssh -i "$EC2_SSH_KEY" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "docker run -d -p $HOST_PORT:8000 --name $APP_NAME --restart always -e GOOGLE_API_KEY=$GOOGLE_API_KEY -e OPENROUTER_API_KEY=$OPENROUTER_API_KEY -e SERPER_API_KEY=$SERPER_API_KEY $DOCKER_IMAGE"
  environment:
    name: $ENV_NAME
    url: "http://3.22.221.134:$HOST_PORT"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        ENV_NAME: production
        APP_NAME: my-app
        HOST_PORT: "8073"
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        ENV_NAME: development
        APP_NAME: my-app-dev
        HOST_PORT: "8074"
