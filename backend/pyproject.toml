[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.3",
    "bcrypt==4.0.1",
    "cryptography>=46.0.4",
    "fastapi>=0.128.0",
    "loguru>=0.7.3",
    "pymysql>=1.1.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.11.0",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "openai>=1.30.0",
    "google-genai>=1.62.0",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests", "tests/models", "tests/schemas", "tests/utils", "tests/workflows",
    "auth/login/tests", "auth/logout/tests", "auth/register/tests",
    "auth/password_reset/tests", "auth/email_verification/tests",
    "goals/goal/tests", "goals/progress/tests", "goals/roadmap/tests",
    "chat/tests",
    "replan/detect/tests", "replan/check/tests", "replan/goal/tests",
    "replan/routes/tests", "replan/llm/tests",
    "notifications/tests",
    "onboarding/tests",
]

